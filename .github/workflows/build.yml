name: Build

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master", "staging" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        name: Setup Bun
      - run: bun install --frozen-lockfile
      - run: bun run test
